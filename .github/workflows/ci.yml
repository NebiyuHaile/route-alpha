name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          DATABASE_URL: sqlite:///./ci-routealpha.sqlite3
          AUTH_SECRET_KEY: ci-only-secret-not-for-production
      - run: python -m alembic upgrade head
        env:
          AUTO_CREATE_SCHEMA: "false"
          DATABASE_URL: sqlite:///./ci-migrations.sqlite3
          AUTH_SECRET_KEY: ci-only-secret-not-for-production
      - run: python -m compileall -q app
        env:
          DATABASE_URL: sqlite:///./ci-routealpha.sqlite3
          AUTH_SECRET_KEY: ci-only-secret-not-for-production

  frontend:
    name: Frontend lint, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next build --webpack
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
          NEXT_PUBLIC_SITE_URL: https://app.example.com
      - run: npm audit --omit=dev --audit-level=high

  containers:
    name: Production container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build --file backend/Dockerfile --tag routealpha-api:ci backend
      - name: Build frontend container
        run: >-
          docker build
          --file frontend/Dockerfile
          --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.com
          --build-arg NEXT_PUBLIC_SITE_URL=https://app.example.com
          --tag routealpha-web:ci
          frontend
