services:
  - type: web
    name: routealpha-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: ENFORCE_HTTPS
        value: "true"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: RATE_LIMIT_STORAGE_URI
        sync: false
      - key: TELEMETRY_REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: MODEL_CHEAP
        sync: false
      - key: MODEL_MEDIUM
        sync: false
      - key: MODEL_STRONG
        sync: false
      - key: MODEL_CHEAP_INPUT_PER_1K
        sync: false
      - key: MODEL_CHEAP_OUTPUT_PER_1K
        sync: false
      - key: MODEL_MEDIUM_INPUT_PER_1K
        sync: false
      - key: MODEL_MEDIUM_OUTPUT_PER_1K
        sync: false
      - key: MODEL_STRONG_INPUT_PER_1K
        sync: false
      - key: MODEL_STRONG_OUTPUT_PER_1K
        sync: false
